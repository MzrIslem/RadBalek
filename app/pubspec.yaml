name: rad_balek
description: "Rad Balek (رد بالك) — early warning for Algeria: heatwaves, wildfires, floods, road danger. Protecting people, vegetation and animals."
publish_to: "none"
version: 0.8.5+20

environment:
  sdk: ^3.12.0

dependencies:
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_tts: ^4.2.0
  geolocator: ^14.0.3
  http: ^1.2.0
  latlong2: ^0.10.1
  provider: ^6.1.0
  share_plus: ^13.2.1
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/fonts/Cairo.ttf
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_fg.png"
  adaptive_icon_monochrome: "assets/icon_mono.png"
